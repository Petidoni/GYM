<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>GYM TRACKER</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#f7f7f8;background:#08090b}*{box-sizing:border-box}body{margin:0;padding-bottom:78px}header{padding:22px 18px 12px;background:linear-gradient(140deg,#220709,#0b0b0d 65%);border-bottom:1px solid #342025}h1{font-size:25px;margin:0;font-weight:950;letter-spacing:-.8px}h1 b{color:#f13038}small,.muted{color:#aaa}main{padding:18px;max-width:660px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.card{background:#191b20;border:1px solid #34363b;border-radius:17px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.muscle{min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:center;border:1px solid #444;border-radius:17px;background:linear-gradient(150deg,#26292e,#101115);font-size:17px;font-weight:800}.muscle span{font-size:30px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button.primary{background:#e5222f;color:white;border-radius:12px;padding:12px 16px;font-weight:800}button.alt{background:#32343a;color:white;border-radius:12px;padding:11px}input,select,textarea{background:#101114;color:white;border:1px solid #494a4f;border-radius:11px;padding:11px;width:100%;min-width:0}label{font-size:13px;color:#c2c2c2;display:block;margin:8px 0 5px}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}.exercise{display:flex;gap:12px;align-items:center}.photo{width:104px;height:100px;object-fit:cover;background:#26292f;border-radius:11px;flex-shrink:0}.photo-empty{display:grid;place-items:center;color:#777;font-size:32px}.sub{font-size:13px;color:#bfc0c2;margin-top:5px}.big{font-weight:800;font-size:19px}.series{display:grid;grid-template-columns:42px 1fr 1fr 38px;gap:7px;align-items:end;margin:9px 0}.series .alt{padding:10px 0}.series label{margin:2px 0 4px}nav{position:fixed;bottom:0;left:0;right:0;background:#111217;border-top:1px solid #414146;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}nav button{flex:1;background:transparent;color:#aaa;padding:12px 0;font-size:12px}nav button.active{color:#ff343d;font-weight:800}.tag{color:#7be2a1;font-size:12px}canvas{width:100%;height:180px}a{color:#ff666b}.danger{color:#ff6d71}.hidden{display:none}h2{margin:2px 0 14px;font-size:21px}h3{margin:4px 0 10px} .hint{font-size:12px;color:#999}.file{margin-top:10px}</style></head><body><header><div class="top"><h1>GYM <b>TRACKER</b></h1><span class="tag" id="saveStatus">● Guardado local</span></div><small>TU PROGRESO, SIN LÍMITES</small></header><main id="app"></main><nav id="nav"><button data-page="home">⌂<br>Entrenar</button><button data-page="history">▤<br>Historial</button><button data-page="progress">▥<br>Progreso</button><button data-page="settings">⚙<br>Ajustes</button></nav><script>
const KEY="gym-tracker-v1",groups=["Pecho","Tríceps","Hombros","Espalda","Bíceps","Piernas"],icons=["🏋️","💪","🎯","🔥","💪","🦵"];let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db&&Array.isArray(db.exercises)&&Array.isArray(db.sessions)?db:{exercises:[],sessions:[]};let page="home",group="",exerciseId="",work=[],restTime=90,timer=null;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));window.gymCloudChanged?.()},newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),latest=id=>db.sessions.filter(s=>s.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date))[0],ex=()=>db.exercises.find(e=>e.id===exerciseId),fmt=s=>s?esc(s.weight)+" kg × "+esc(s.reps)+" reps":"Sin registros",line=(label,val)=>'<div class="top"><span class="muted">'+label+'</span><strong>'+val+'</strong></div>';function nav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));}
function go(p,g,id){page=p;group=g??group;exerciseId=id??exerciseId;work=[];clearInterval(timer);render();window.scrollTo(0,0)}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));function button(label,fn,klass="primary"){return '<button class="'+klass+'" onclick="'+fn+'">'+label+'</button>'}
function render(){nav();const a=$("app");if(page==="home"){a.innerHTML='<h2>¿Qué entrenas hoy?</h2><p class="muted">Selecciona el grupo muscular que vas a entrenar.</p><div class="grid">'+groups.map((g,i)=>'<button class="muscle" onclick="go(\'group\',\''+g+'\')"><span>'+icons[i]+'</span>'+g+'</button>').join("")+'</div>'+ (db.sessions.length?'<div class="card">'+line("Sesiones registradas",db.sessions.length)+line("Ejercicios creados",db.exercises.length)+'</div>':'<div class="card muted">Crea tu primer ejercicio, sube la foto de tu máquina y registra cada serie.</div>');}
else if(page==="group"){const aex=db.exercises.filter(e=>e.group===group);a.innerHTML='<div class="top"><h2>'+group+'</h2>'+button("＋ Ejercicio","showExerciseForm()")+'</div><div id="newEx"></div>'+ (aex.length?aex.map(e=>{const last=latest(e.id);return '<div class="card exercise">'+(e.image?'<img class="photo" src="'+e.image+'" alt="Máquina">':'<div class="photo photo-empty">🏋️</div>')+'<div class="grow"><strong>'+esc(e.name)+'</strong><div class="sub">Última serie: '+fmt(last?.sets?.at(-1))+'</div><div style="margin-top:10px">'+button("Registrar →","go(\'log\',null,\'"+e.id+"\')")+'</div></div></div>'}).join(""):'<div class="card muted">Todavía no hay ejercicios en esta categoría. Usa “＋ Ejercicio” para añadir el primero.</div>');}
else if(page==="log"){const e=ex();if(!e){go("home");return}const last=latest(e.id);a.innerHTML='<div class="top"><h2>'+esc(e.name)+'</h2>'+button("Atrás","go(\'group\')","alt")+'</div>'+(e.image?'<img src="'+e.image+'" style="width:100%;max-height:260px;object-fit:cover;border-radius:16px" alt="Máquina">':'')+'<div class="card"><small>ÚLTIMO ENTRENAMIENTO</small><div class="big">'+(last?last.sets.map(s=>fmt(s)).join(' · '):"Aún no hay registros")+'</div></div><h3>Series de hoy</h3><div id="seriesList"></div>'+button("＋ Añadir serie","addSeries()","alt")+'<div class="card"><div class="top"><div>⏱ Descanso <strong id="timeLabel">01:30</strong></div>'+button("Iniciar / Reiniciar","startRest()","alt")+'</div><div class="row" style="margin-top:10px"><button class="alt" onclick="restTime=60;resetRest()">1:00</button><button class="alt" onclick="restTime=90;resetRest()">1:30</button><button class="alt" onclick="restTime=120;resetRest()">2:00</button></div></div>'+button("Guardar entrenamiento","saveSession()"); if(!work.length){const prev=last?.sets||[];work=(prev.length?prev:[{weight:0,reps:10}]).map(s=>({...s}))}showSeries();}
else if(page==="history"){const sessions=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date));a.innerHTML='<h2>Historial</h2>'+ (sessions.length?sessions.map(s=>{let e=db.exercises.find(e=>e.id===s.exerciseId);return '<div class="card"><div class="top"><strong>'+esc(e?.name||"Ejercicio eliminado")+'</strong><small>'+esc(new Date(s.date).toLocaleString("es-PE"))+'</small></div><div class="sub">'+s.sets.map(fmt).join(" • ")+'</div><div style="margin-top:12px">'+button("Eliminar","deleteSession(\'"+s.id+"\')","alt")+'</div></div>'}).join(""):'<p class="muted">Aquí aparecerán tus entrenamientos guardados.</p>');}
else if(page==="progress"){let total=db.sessions.reduce((n,s)=>n+s.sets.reduce((m,t)=>m+Number(t.weight)*Number(t.reps),0),0);let max=Math.max(0,...db.sessions.flatMap(s=>s.sets.map(t=>Number(t.weight))));a.innerHTML='<h2>Tu progreso</h2><div class="grid"><div class="card"><small>Entrenamientos</small><div class="big">'+db.sessions.length+'</div></div><div class="card"><small>Mayor carga registrada</small><div class="big">'+max+' kg</div></div></div><div class="card"><small>Volumen total acumulado</small><div class="big">'+Math.round(total).toLocaleString("es-PE")+' kg</div></div><label>Ejercicio</label><select id="chartSelect" onchange="drawChart()">'+db.exercises.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join("")+'</select><div class="card"><h3>Evolución de peso máximo por sesión</h3><canvas id="chart" width="620" height="220"></canvas><div class="hint">Valores registrados, no estimaciones.</div></div>';drawChart();}
else if(page==="settings"){a.innerHTML='<h2>Configuración</h2><div id="cloudPanel"></div><div class="card"><h3>Almacenamiento</h3><p class="muted">Esta versión web guarda tus datos en este navegador. La sincronización en la nube no está activada: realiza copias de seguridad.</p><p class="danger">Si borras los datos del navegador sin exportarlos, podrías perder tu historial.</p></div><div class="card"><h3>Exportar e importar</h3><div class="row">'+button("Exportar JSON","exportJSON()")+button("Exportar CSV","exportCSV()","alt")+'</div><label>Restaurar copia JSON</label><input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></div><div class="card"><h3>Mis ejercicios</h3>'+db.exercises.map(e=>'<div class="top" style="margin:12px 0"><span>'+esc(e.group)+' · '+esc(e.name)+'</span>'+button("Eliminar","deleteExercise(\'"+e.id+"\')","alt")+'</div>').join("")+'</div>';}
}
function showExerciseForm(){$("newEx").innerHTML='<div class="card"><h3>Nueva máquina o ejercicio</h3><label>Nombre</label><input id="exName" placeholder="Ej.: High Row"><label>Foto desde galería o cámara</label><input type="file" id="exImage" accept="image/*"><p class="hint">Las imágenes se comprimen y guardan solo en este dispositivo.</p>'+button("Guardar ejercicio","createExercise()")+'</div>'}async function createExercise(){const name=$("exName").value.trim();if(!name)return alert("Escribe el nombre del ejercicio");let img="",f=$("exImage").files[0];if(f){img=await compress(f)}db.exercises.push({id:newId(),group,name,image:img});try{save()}catch{db.exercises.pop();return alert("No queda espacio en el navegador; usa una foto más pequeña.")}render()}
function compress(f){return new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const canvas=document.createElement("canvas"),scale=Math.min(1,640/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext("2d").drawImage(im,0,0,canvas.width,canvas.height);ok(canvas.toDataURL("image/jpeg",.65))};im.onerror=no;im.src=reader.result};reader.onerror=no;reader.readAsDataURL(f)})}
function addSeries(){const prev=work.at(-1)||{weight:0,reps:10};work.push({...prev});showSeries()}function showSeries(){const slot=$("seriesList");if(!slot)return;slot.innerHTML=work.map((s,i)=>'<div class="card series"><div><small>#'+(i+1)+'</small></div><div><label>Peso (kg)</label><input type="number" min="0" step=".5" value="'+esc(s.weight)+'" oninput="work['+i+'].weight=this.value"></div><div><label>Reps</label><input type="number" min="1" step="1" value="'+esc(s.reps)+'" oninput="work['+i+'].reps=this.value"></div><button class="alt" onclick="work.splice('+i+',1);showSeries()">✕</button></div>').join("")}
function saveSession(){const sets=work.map(s=>({weight:Number(s.weight),reps:Number(s.reps)}));if(!sets.length||sets.some(s=>!Number.isFinite(s.weight)||s.weight<0||!Number.isInteger(s.reps)||s.reps<=0))return alert("Revisa peso y repeticiones de cada serie");db.sessions.push({id:newId(),exerciseId,date:new Date().toISOString(),sets});try{save()}catch{db.sessions.pop();return alert("No se pudo guardar: almacenamiento lleno")}alert("¡Entrenamiento guardado!");go("group")}
function deleteSession(id){if(confirm("¿Eliminar este entrenamiento?")){db.sessions=db.sessions.filter(s=>s.id!==id);save();render()}}function deleteExercise(id){if(confirm("¿Eliminar este ejercicio y todo su historial?")){db.exercises=db.exercises.filter(e=>e.id!==id);db.sessions=db.sessions.filter(s=>s.exerciseId!==id);save();render()}}
function resetRest(){clearInterval(timer);$("timeLabel").textContent=clock(restTime)}function clock(v){return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0")}function startRest(){clearInterval(timer);let t=restTime;$("timeLabel").textContent=clock(t);timer=setInterval(()=>{t--;$("timeLabel").textContent=clock(Math.max(t,0));if(t<=0){clearInterval(timer);if(navigator.vibrate)navigator.vibrate(200)}},1000)}
function drawChart(){const c=$("chart"),sel=$("chartSelect");if(!c||!sel)return;let ctx=c.getContext("2d"),sessions=db.sessions.filter(s=>s.exerciseId===sel.value).sort((a,b)=>a.date.localeCompare(b.date)).slice(-20),vals=sessions.map(s=>Math.max(...s.sets.map(t=>Number(t.weight))));ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle="#414348";ctx.lineWidth=1;for(let i=0;i<5;i++){let y=15+i*45;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(605,y);ctx.stroke()}if(!vals.length){ctx.fillStyle="#aaa";ctx.font="18px system-ui";ctx.fillText("Aún no hay datos para este ejercicio",75,110);return}let max=Math.max(1,...vals),min=0;ctx.strokeStyle="#f32e37";ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{let x=50+(i*(550/Math.max(vals.length-1,1))),y=194-(v-min)/(max-min)*165;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#fff";ctx.font="13px system-ui";ctx.fillText(max+" kg",5,30);ctx.fillText("0 kg",5,197);vals.forEach((v,i)=>{let x=50+i*(550/Math.max(vals.length-1,1)),y=194-v/max*165;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle="#ff4148";ctx.fill()})}
function download(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download("gym-tracker-respaldo.json",JSON.stringify(db,null,2),"application/json")}function exportCSV(){const rows=[["Fecha","Grupo","Ejercicio","Serie","Peso kg","Reps"]];db.sessions.forEach(s=>{let e=db.exercises.find(e=>e.id===s.exerciseId);s.sets.forEach((set,i)=>rows.push([s.date,e?.group||"",e?.name||"",i+1,set.weight,set.reps]))});download("gym-tracker-series.csv","\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")}
async function importJSON(f){if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.exercises)||!Array.isArray(obj.sessions))throw Error();if(!confirm("¿Reemplazar todos los datos actuales por los de esta copia?"))return;db=obj;save();go("home")}catch{alert("Copia JSON inválida o demasiado grande")}}
render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./cloud.js"></script></body></html>
